name: Build FormaX APK from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract FormaX ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/unpacked"

          if [ -f "$RUNNER_TEMP/unpacked/formax/package.json" ]; then
            PROJECT_DIR="$RUNNER_TEMP/unpacked/formax"
          elif [ -f "$RUNNER_TEMP/unpacked/package.json" ]; then
            PROJECT_DIR="$RUNNER_TEMP/unpacked"
          else
            echo "Could not find package.json at the expected ZIP locations."
            find "$RUNNER_TEMP/unpacked" -maxdepth 3 -name package.json -print
            exit 1
          fi

          rsync -a --exclude='.git' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build
          node scripts/sync-android.mjs

      - name: Build debug APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormaX-Android-APK
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
