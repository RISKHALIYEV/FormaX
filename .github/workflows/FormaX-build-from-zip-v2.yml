name: Build FormaX APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and locate FormaX project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository root."
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/formax-unpacked"
          mkdir -p "$EXTRACT_DIR"
          unzip -q "$ZIP_FILE" -d "$EXTRACT_DIR"

          SYNC_SCRIPT="$(find "$EXTRACT_DIR" -type f -path '*/scripts/sync-android.mjs' -print -quit)"
          if [ -z "$SYNC_SCRIPT" ]; then
            echo "::error::Could not find scripts/sync-android.mjs inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$SYNC_SCRIPT")")"
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json missing in detected project."
            find "$EXTRACT_DIR" -name package.json -print
            exit 1
          fi
          if [ ! -d "$PROJECT_DIR/apps/android" ]; then
            echo "::error::apps/android directory missing."
            exit 1
          fi

          echo "Using project: $PROJECT_DIR"
          rsync -a --delete --exclude='.git' "$PROJECT_DIR/" "$GITHUB_WORKSPACE/"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web app
        run: npm run build

      - name: Sync web assets into Android app
        run: node scripts/sync-android.mjs

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/android/gradlew
          test -f apps/android/app/build.gradle.kts
          chmod +x apps/android/gradlew

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FormaX-Android-APK
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
